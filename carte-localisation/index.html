<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte de localisation</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Localisation</h1>
    <p>Entrez une adresse pour afficher la carte (comme Google Maps).</p>
  </header>

  <form id="search-form">
    <input
      id="address"
      type="text"
      placeholder="SUD PROTOTYPE, 71 AVENUE DE L'ETOILE, 13710, FUVEAU"
      value="SUD PROTOTYPE, 71 AVENUE DE L'ETOILE, 13710, FUVEAU"
      autocomplete="off"
    />
    <button type="submit">Afficher</button>
  </form>

  <p id="status" class="status"></p>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
